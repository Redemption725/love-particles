<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>予你</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const BASE_WIDTH = 1920;
const BASE_HEIGHT = 1080;
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize(); 
function heart(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    return {x, y};
}
class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = Math.random() * 2 - 1;
        this.vy = Math.random() * -2 - 0.5;
        this.color = `rgba(${Math.random()*55 + 200}, ${Math.random()*100 + 100}, ${Math.random()*55 + 200}, 1)`; 
        this.life = Math.random() * 100 + 50;
        this.maxLife = this.life;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        this.vx *= 0.98;
        this.vy *= 0.98;
    }

    draw() {
        const alpha = this.life / this.maxLife;
        ctx.fillStyle = this.color.replace('1)', `${alpha})`);
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
        ctx.fill();
    }
}

let particles = [];

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const scale = Math.min(canvas.width / BASE_WIDTH, canvas.height / BASE_HEIGHT) * 35;

    // 每帧生成新粒子（沿爱心轮廓）
    for (let i=0; i<15; i++) { 
        const t = Math.random() * Math.PI * 2;
        const {x, y} = heart(t);
        const px = canvas.width/2 + x * scale;
        const py = canvas.height/2 + y * scale;
        particles.push(new Particle(px, py));
    }
    for (let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.life <= 0) particles.splice(i, 1);
    }
    const fontSize = Math.min(canvas.width, canvas.height) / 10; 
    
    ctx.font = `bold ${fontSize}px "Microsoft YaHei", Arial`;
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle'; 
    const lineHeight = fontSize * 1.2; 
    ctx.fillText('岁岁年年', canvas.width/2, canvas.height/2 - lineHeight/2);

   anvas.height/2 + lineHeight/2);

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
